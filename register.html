<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – Spectra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">Spectra<span>.</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto ms-3 gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-login btn-sm">Login</a>
          <a href="register.html" class="btn btn-outline-light btn-sm">Register</a>
        </div>
      </div>
    </div>
  </nav>
  <div style="position:relative;">
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-header">
        <h5>Create an account</h5>
        <p>Join Spectra and start shopping</p>
      </div>
      <div class="card-body">
        <form action="login.html">
          <div class="row g-3 mb-3">
            <div class="col">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" placeholder="Rahul" required/>
            </div>
            <div class="col">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" placeholder="Sharma" required/>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="you@example.com" required/>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" placeholder="+91 98765 43210"/>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Min. 8 characters" required/>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" placeholder="••••••••" required/>
          </div>
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="terms" required/>
            <label class="form-check-label" for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
          </div>
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-accent py-2">Create Account</button>
          </div>
          <p class="text-center mb-0 text-muted" style="font-size:0.82rem;">
            Already have an account? <a href="login.html">Sign in</a>
          </p>
        </form>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
