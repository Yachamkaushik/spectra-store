<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="favicon.ico"/>
  <title>Login – Spectra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">Spectra<span>.</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto ms-3 gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-login btn-sm">Login</a>
          <a href="register.html" class="btn btn-outline-light btn-sm">Register</a>
        </div>
      </div>
    </div>
  </nav>
  <div style="position:relative;">
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-header">
        <h5>Welcome back</h5>
        <p>Sign in to your Spectra account</p>
      </div>
      <div class="card-body">
        <form action="catalog.html">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="you@example.com" required/>
          </div>
          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label class="form-label">Password</label>
              <a href="#" style="font-size:0.78rem;">Forgot password?</a>
            </div>
            <input type="password" class="form-control" placeholder="••••••••" required/>
          </div>
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-accent py-2">Sign In</button>
          </div>
          <p class="text-center mb-0 text-muted" style="font-size:0.82rem;">
            Don't have an account? <a href="register.html">Create one</a>
          </p>
        </form>
      </div>
    </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
